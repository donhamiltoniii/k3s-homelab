apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      initContainers:
        # Ensures configuration.yaml (on the PVC, written by HA at runtime)
        # contains the packages include so the Git-managed ConfigMap below is
        # actually loaded. Idempotent; safe whether or not a homeassistant:
        # block already exists.
        - name: ensure-packages-include
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              CONFIG=/config/configuration.yaml
              touch "$CONFIG"
              if grep -q "packages: !include_dir_named packages" "$CONFIG"; then
                echo "packages include already present"
              elif grep -q "^homeassistant:" "$CONFIG"; then
                echo "inserting packages include under existing homeassistant: block"
                sed -i '/^homeassistant:/a\  packages: !include_dir_named packages' "$CONFIG"
              else
                echo "appending new homeassistant: block with packages include"
                printf '\nhomeassistant:\n  packages: !include_dir_named packages\n' >> "$CONFIG"
              fi
          volumeMounts:
            - name: home-assistant-config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - containerPort: 8123
          env:
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: home-assistant-config
              mountPath: /config
            - name: ha-packages
              mountPath: /config/packages
      volumes:
        - name: home-assistant-config
          persistentVolumeClaim:
            claimName: home-assistant-pvc
        - name: ha-packages
          configMap:
            name: home-assistant-packages
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-packages
  labels:
    app: home-assistant
data:
  reverse_proxy.yaml: |
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 192.168.0.0/24
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8123
  selector:
    app: home-assistant
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: homeassistant.k3s.syntaxandsymbols.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 80
